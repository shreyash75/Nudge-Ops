services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nudgeops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nudgeops}
      POSTGRES_DB: ${POSTGRES_DB:-nudgeops}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/self-managed-postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      KUBECONFIG_PATH: ${KUBECONFIG_PATH:-}
      BACKEND_CORS_ORIGINS: http://localhost:3000
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://nudgeops:nudgeops@postgres:5432/nudgeops}
      AUTH_SECRET: ${AUTH_SECRET:-}
    volumes:
      - "${KUBECONFIG_FILE:-${USERPROFILE}/.kube/config}:/root/.kube/config:ro"
      - "${AWS_CONFIG_DIR:-${USERPROFILE}/.aws}:/root/.aws:ro"
      - backend-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
  backend-data:
