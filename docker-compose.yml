services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      KUBECONFIG_PATH: ${KUBECONFIG_PATH:-}
      BACKEND_CORS_ORIGINS: http://localhost:3000
      INSFORGE_URL: ${INSFORGE_URL:-}
      INSFORGE_API_KEY: ${INSFORGE_API_KEY:-}
      INSFORGE_HISTORY_TABLE: ${INSFORGE_HISTORY_TABLE:-investigation_history}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_DATABASE_PATH: ${AUTH_DATABASE_PATH:-data/app_users.db}
    volumes:
      - "${KUBECONFIG_FILE:-${USERPROFILE}/.kube/config}:/root/.kube/config:ro"
      - "${AWS_CONFIG_DIR:-${USERPROFILE}/.aws}:/root/.aws:ro"
      - backend-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
