# Scenario 2: ImagePullBackOff caused by an image tag that does not exist.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nudgeops-imagepull
  namespace: nudgeops-test
  labels:
    app: nudgeops-imagepull
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nudgeops-imagepull
  template:
    metadata:
      labels:
        app: nudgeops-imagepull
    spec:
      containers:
        - name: app
          image: busybox:no-such-tag-0.0.0
          command:
            - sh
            - -c
            - sleep 3600
