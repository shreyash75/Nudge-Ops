apiVersion: apps/v1
kind: Deployment

metadata: 
  name: frontend-deployment
  namespace: nudge
  labels:
    app: frontend

spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  
  template:
    metadata: 
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: shreyash75/nudge-frontend:ad4c582
        imagePullPolicy: Always
        ports:
        - containerPort: 80

        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"

        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5